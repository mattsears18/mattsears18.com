<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The evolution of my CI: cloud, then local scripts, then self-hosted runners</title>
  <desc id="d">A three-panel diagram. Original: the real GitHub Actions workflows run on GitHub's rented cloud runners at $489 a month while my Mac only pushes. Version one: the pipeline is rewritten as local scripts on my Mac — about $0, but a hand-maintained copy that can drift and whose merge status is hand-posted. Version two, the better fix: the exact same unchanged ci.yml runs on my Mac as three self-hosted runners, also about $0, with nothing to keep in sync and the real GitHub merge gate. In every version, EAS builds, Vercel deploys, and store uploads stay remote.</desc>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#737373"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#C2410C"/></marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#737373">Same CI, three homes for the compute</text>
  <text x="450" y="51" text-anchor="middle" font-size="12.5" fill="#737373">The workflows never changed — only the machine that runs them, and the bill.</text>

  <!-- column dividers -->
  <line x1="300" y1="74" x2="300" y2="356" stroke="#737373" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="600" y1="74" x2="600" y2="356" stroke="#737373" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- transition arrows (mid machine band) -->
  <line x1="283" y1="165" x2="317" y2="165" stroke="#737373" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="583" y1="165" x2="617" y2="165" stroke="#C2410C" stroke-width="3" marker-end="url(#aa)"/>
  <text x="600" y="151" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C2410C">better</text>

  <!-- ============ PANEL 1 — cloud ============ -->
  <text x="150" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#737373">ORIGINAL — cloud runners</text>

  <!-- cloud -->
  <path d="M94,182 C70,182 61,160 78,149 C72,127 100,114 119,126 C128,107 170,107 181,128 C210,120 233,141 222,158 C240,163 237,182 217,182 Z" fill="none" stroke="#737373" stroke-width="1.6"/>
  <text x="150" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#737373">GitHub Actions</text>
  <text x="150" y="167" text-anchor="middle" font-size="9" fill="#737373">ubuntu-latest · rented</text>
  <text x="150" y="204" text-anchor="middle" font-size="9.5" font-style="italic" fill="#737373">the real ci.yml runs up here</text>

  <text x="150" y="256" text-anchor="middle" font-size="25" font-weight="800" fill="#C2410C">$489 / mo</text>
  <text x="150" y="278" text-anchor="middle" font-size="10" fill="#737373">billed by the minute</text>
  <text x="150" y="296" text-anchor="middle" font-size="9.5" font-style="italic" fill="#737373">my Mac only pushes</text>

  <!-- ============ PANEL 2 — local scripts (v1) ============ -->
  <text x="450" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#737373">v1 — local scripts</text>

  <!-- laptop -->
  <rect x="357" y="120" width="186" height="90" rx="8" fill="none" stroke="#737373" stroke-width="1.7"/>
  <path d="M352,214 L548,214 L560,225 L340,225 Z" fill="none" stroke="#737373" stroke-width="1.7"/>
  <text x="450" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#737373">ci-local.js · ci-report.js</text>
  <text x="450" y="171" text-anchor="middle" font-size="9.5" font-style="italic" fill="#737373">a script copy of the pipeline</text>
  <text x="450" y="194" text-anchor="middle" font-size="9.5" fill="#C2410C">can drift from real CI</text>

  <text x="450" y="262" text-anchor="middle" font-size="22" font-weight="800" fill="#C2410C">~$0 / mo</text>
  <text x="450" y="284" text-anchor="middle" font-size="10" fill="#737373">cheap — but hand-maintained</text>
  <text x="450" y="302" text-anchor="middle" font-size="9.5" font-style="italic" fill="#737373">merge status hand-posted</text>

  <!-- ============ PANEL 3 — self-hosted runners (v2) ============ -->
  <text x="750" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">v2 — self-hosted runners</text>

  <!-- laptop (active) -->
  <rect x="657" y="120" width="186" height="90" rx="8" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M652,214 L848,214 L860,225 L640,225 Z" fill="none" stroke="#C2410C" stroke-width="2"/>
  <text x="750" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#737373">the same ci.yml</text>
  <text x="750" y="171" text-anchor="middle" font-size="9.5" font-style="italic" fill="#737373">3 self-hosted runners on one Mac</text>
  <text x="750" y="194" text-anchor="middle" font-size="9.5" fill="#C2410C">nothing to keep in sync</text>

  <text x="750" y="262" text-anchor="middle" font-size="22" font-weight="800" fill="#C2410C">~$0 / mo</text>
  <text x="750" y="284" text-anchor="middle" font-size="10" fill="#737373">runners aren't billed minutes</text>
  <text x="750" y="302" text-anchor="middle" font-size="9.5" font-style="italic" fill="#737373">real GitHub merge gate</text>

  <!-- footer -->
  <line x1="120" y1="356" x2="780" y2="356" stroke="#737373" stroke-opacity="0.2" stroke-width="1"/>
  <text x="450" y="382" text-anchor="middle" font-size="10.5" font-style="italic" fill="#737373">Same workflows, same triggers, same green checkmarks — only the machine and the bill changed.</text>
  <text x="450" y="401" text-anchor="middle" font-size="9" fill="#737373" fill-opacity="0.8">EAS builds, Vercel deploys, and store uploads stay remote in every version — the runner only talks to them.</text>
</svg>
